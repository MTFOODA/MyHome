name: myhome_flutter
description: MyHome real estate and shared housing marketplace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  dio: ^5.8.0+1
  get_it: ^8.0.3
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  flutter_map: 8.3.2
  latlong2: 0.9.1
  geolocator: 14.1.2
  url_launcher: 6.3.3
  flutter_map_dragmarker: 8.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/illustrations/
