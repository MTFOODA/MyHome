# Optional local demo gateway. Never mounts secrets, private media or the repository root.
services:
  demo-web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ../artifacts/share-web:/srv:ro
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      demo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 12
  demo-share:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://demo-web:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      demo-web:
        condition: service_healthy
